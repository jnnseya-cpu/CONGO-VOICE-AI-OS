# SEC-12. What a dependency audit does not catch.
#
# The audit in CI reads a lockfile. These read the code and the image: a query
# built from a template string, a secret committed by accident, a base image
# with a known hole. None of them replace an independent penetration test,
# which is programme work and is recorded as such in docs/REQUIREMENTS.md.
name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  code-scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  secret-scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # A secret is usually committed once and removed in the next commit;
          # scanning only the tip would miss every one of them.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the image the way a deployment would
        run: docker build -t congovoice:ci .
      - name: Scan it for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: congovoice:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # Report rather than block: a base-image advisory with no fix
          # available must not stop a safety fix from shipping.
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: container
